<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>data.json editor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <h1>data.json editor</h1>
    <button class="btn btn--secondary" id="loadFile">Open file…</button>
    <button class="btn btn--secondary" id="loadRemote">Fetch ../data.json</button>
    <button class="btn btn--secondary" id="loadPaste">Load from output box</button>
    <button class="btn" id="copy">Copy JSON</button>
    <span class="status" id="status"></span>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </header>

  <main class="page">
    <p class="hint">
      Edit below, then press <b>Copy JSON</b> and paste it over <code>data.json</code> in VS Code.
      Times are shown in your local zone (<span id="tzname"></span>) and UTC.
    </p>

    <div id="app"></div>

    <section class="section">
      <h2>Output JSON</h2>
      <textarea class="output" id="out" spellcheck="false"></textarea>
      <div class="error" id="jsonErr"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
